name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile points at a private feed (author's local npm setup); on the runner only,
      # rewrite those URLs to public npm, which hosts the same packages.
      - name: Use public npm registry
        run: sed -i 's#https://kochag.pkgs.visualstudio.com/_packaging/KochAg/npm/registry/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
